services:

  # ============================================================
  # KAFKA CLUSTER - 3 BROKERS / KRaft
  # ============================================================

  broker:
    image: apache/kafka:4.2.1
    hostname: broker
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: kafka_cluster

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker:9093,EXTERNAL://localhost:9092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:9094,2@broker2:9094,3@broker3:9094"

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2

    volumes:
      - kafka_data_1:/var/lib/kafka/data


  broker2:
    image: apache/kafka:4.2.1
    hostname: broker2
    container_name: kafka-2
    ports:
      - "9095:9092"
    environment:
      CLUSTER_ID: kafka_cluster

      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker2:9093,EXTERNAL://localhost:9095"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:9094,2@broker2:9094,3@broker3:9094"

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2

    volumes:
      - kafka_data_2:/var/lib/kafka/data


  broker3:
    image: apache/kafka:4.2.1
    hostname: broker3
    container_name: kafka-3
    ports:
      - "9096:9092"
    environment:
      CLUSTER_ID: kafka_cluster

      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker3:9093,EXTERNAL://localhost:9096"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:9094,2@broker2:9094,3@broker3:9094"

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2

    volumes:
      - kafka_data_3:/var/lib/kafka/data


  # ============================================================
  # SCHEMA REGISTRY
  # ============================================================

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.1
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      - broker
      - broker2
      - broker3
    ports:
      - "8083:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://broker:9093,PLAINTEXT://broker2:9093,PLAINTEXT://broker3:9093"


  # ============================================================
  # KAFKA UI
  # ============================================================

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - broker
      - broker2
      - broker3
      - schema-registry
    ports:
      - "8084:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: restaurant-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker:9093,broker2:9093,broker3:9093"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"


  # ============================================================
  # SPARK MASTER
  # ============================================================

  master-spark:
    build:
      context: .
      dockerfile: ./scripts/Dockerfile
    image: restaurant-spark:4.1.3
    hostname: spark-master
    container_name: spark-master
    ports:
      - "7077:7077"
      - "8080:8080"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5


  # ============================================================
  # SPARK DRIVER
  # ============================================================

  spark-driver:
    image: restaurant-spark:4.1.3
    hostname: spark-driver
    container_name: spark-driver
    depends_on:
      master-spark:
        condition: service_healthy
    ports:
      - "4040:4040"
    environment:
      SPARK_MASTER: spark://spark-master:7077
    volumes:
      - ./scripts:/opt/spark/scripts
      - ./schemas:/opt/spark/schemas
      - ./data:/opt/spark/data
    command: tail -f /dev/null


  # ============================================================
  # SPARK WORKER 1
  # ============================================================

  spark-worker:
    image: restaurant-spark:4.1.3
    hostname: spark-worker-1
    container_name: spark-worker-1
    depends_on:
      master-spark:
        condition: service_healthy
    environment:
      SPARK_MASTER: spark://spark-master:7077
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G


  # ============================================================
  # SPARK WORKER 2
  # ============================================================

  spark-worker2:
    image: restaurant-spark:4.1.3
    hostname: spark-worker-2
    container_name: spark-worker-2
    depends_on:
      master-spark:
        condition: service_healthy
    environment:
      SPARK_MASTER: spark://spark-master:7077
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G


  # ============================================================
  # SPARK WORKER 3
  # ============================================================

  spark-worker3:
    image: restaurant-spark:4.1.3
    hostname: spark-worker-3
    container_name: spark-worker-3
    depends_on:
      master-spark:
        condition: service_healthy
    environment:
      SPARK_MASTER: spark://spark-master:7077
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G


  # ============================================================
  # POSTGRESQL
  # ============================================================

  postgres:
    image: postgres:16
    hostname: postgres
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: restaurant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 5


  # ============================================================
  # PGADMIN
  # ============================================================

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin


  # ============================================================
  # AIRFLOW
  # ============================================================

  airflow:
    build:
      context: .
      dockerfile: ./airflow/Dockerfile
    image: restaurant-airflow:3.0.6
    container_name: airflow
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://admin:admin@postgres:5432/restaurant
      KAFKA_BOOTSTRAP_SERVERS: "broker:9093,broker2:9093,broker3:9093"
      PYTHONPATH: /opt/airflow
      AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    group_add:
      - "1001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./producers:/opt/airflow/producers
      - ./extract_data:/opt/airflow/extract_data
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./schemas:/opt/airflow/schemas
    command: standalone


  # ============================================================
  # DBT
  # ============================================================

  dbt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbt
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DBT_PROFILES_DIR: /root/.dbt
    volumes:
      - ./dbt:/usr/app
      - ./dbt/profiles:/root/.dbt
    working_dir: /usr/app
    command: tail -f /dev/null

  # ============================================================
  # SUPERSET METADATA DATABASE
  # ============================================================
  # ============================================================
  # SUPERSET INIT
  # ============================================================

  superset-init:
    build:
      context: ./superset
      dockerfile: Dockerfile
    container_name: superset-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SUPERSET_SECRET_KEY: "change-this-to-a-random-secret-key"
      ADMIN_USERNAME: admin
      ADMIN_FIRSTNAME: Superset
      ADMIN_LASTNAME: Admin
      ADMIN_EMAIL: admin@superset.com
      ADMIN_PASSWORD: admin
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py:ro
      - superset_home:/app/superset_home
    command:
      - /bin/sh
      - -c
      - |
        superset db upgrade
        superset fab create-admin \
          --username "$$ADMIN_USERNAME" \
          --firstname "$$ADMIN_FIRSTNAME" \
          --lastname "$$ADMIN_LASTNAME" \
          --email "$$ADMIN_EMAIL" \
          --password "$$ADMIN_PASSWORD"
        superset init
  # ============================================================
  # SUPERSET
  # ============================================================
  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    hostname: superset
    container_name: superset
    depends_on:
      superset-init:
        condition: service_completed_successfully
    ports:
      - "8088:8088"
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SUPERSET_SECRET_KEY: "change-this-to-a-random-secret-key"
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py:ro
      - superset_home:/app/superset_home
    command:
      - /bin/sh
      - -c
      - |
        gunicorn \
          --bind 0.0.0.0:8088 \
          --workers 2 \
          --timeout 120 \
          "superset.app:create_app()"
# ============================================================
# VOLUMES
# ============================================================

volumes:
  kafka_data_1:
  kafka_data_2:
  kafka_data_3:
  postgres_data:
  pgadmin_data:
  superset_home: